[package]
authors = [ "Ypuf <ypuf@jpuf.xyz>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Typed config file format"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "tesserae" ]
license = "MIT"
name = "tree-sitter-tesserae"
readme = "README.md"
repository = "https://github.com/Ypuf/Tesserae"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
